plugins {
    id 'com.android.application'
}

android {
    namespace 'net.userdevice.drosstable'
    compileSdk 34

    defaultConfig {
        applicationId "net.userdevice.drosstable"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies — plain android.app.Activity + WebView, no androidx needed.
